<div class="navbar-container">
    <nav class="navbar">
        <div class="set-pointer" (click)="services.scrollTo('about-me'); dropdownMenu()">
            {{services.language == "en" ?
            "About Me" :
            "Über mich" }}
        </div>
        <div class="set-pointer" (click)="services.scrollTo('skills'); dropdownMenu()">
            {{services.language == "en" ?
            "Skills" :
            "Fähigkeiten" }}

        <div class="set-pointer" (click)="services.scrollTo('portfolio'); dropdownMenu()">
