<section>
    <mat-card class="card" appearance="outlined">

        <mat-card-content class="card-content">
            
            <div class="center">
                <app-imprint *ngIf="services.language=='en'"></app-imprint>
                <app-impressum *ngIf="services.language=='de'"></app-impressum>
            <!--</div>
            <div class="bottom">-->
                <app-data-protection *ngIf="services.language=='en'"></app-data-protection>
                <app-datenschutz *ngIf="services.language=='de'"></app-datenschutz>
            </div>
            <div class="top">
                <img class="set-pointer" src="assets/img/close_small.png" alt="" (click)="closeCard()">
            </div>
        </mat-card-content>
    </mat-card>
</section>
