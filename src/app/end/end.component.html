<div class="end">
    <div class="left">
        <div class="logo-container">
            <div (click)="services.scrollTo('start')" class="logo set-pointer">
                <img src="assets/img/logo.png" alt="">
                <div class="logo-name">
                    <span>artin</span>
                    <span>eifschneider</span>
                </div>
            </div>
            <div class="description">
                <span>
                    {{services.language == "en" ? 'Web Developer' : 'Webentwickler'}}
                </span>
                <span>
                    {{services.language == "en" ? 'Frankfurt Germany' : 'Frankfurt Deutschland'}}
                </span>
            </div>
        </div>
    </div>
    <div class="center">
        <div class="copyright">
            © Martin Reifschneider 2025
        </div>
    </div>
    <div class="right">
        <div class="links">
            <button (click)="services.openGitHub()" mat-button>
                <svg width="8" height="8" viewBox="0 0 8 8">
                    <circle cx="4" cy="4" r="3" fill="currentColor" />
                </svg>
                <span> Github</span>
            </button>
            <button (click)="services.openLinkedin()" mat-button>
                <svg width="8" height="8" viewBox="0 0 8 8">
                    <circle cx="4" cy="4" r="3" fill="currentColor" />
                </svg>
                <span> Linkedin</span>
            </button>
            <button (click)="services.scrollAndHighlight()" mat-button>
                <svg width="8" height="8" viewBox="0 0 8 8">
                    <circle cx="4" cy="4" r="3" fill="currentColor" />
                </svg>
                <span> Email</span>
            </button>
            <button (click)="openCard('legalNotice')" mat-button>
                <svg width="8" height="8" viewBox="0 0 8 8">
                    <circle cx="4" cy="4" r="3" fill="currentColor" />
                </svg>
                <span> {{services.language == "en" ? 'Legal Notice' : 'Rechtshinweis'}}</span>
            </button>
            <button (click)="openCard('imprint')" mat-button>
                <svg width="8" height="8" viewBox="0 0 8 8">
                    <circle cx="4" cy="4" r="3" fill="currentColor" />
                </svg>
                <span> {{services.language == "en" ? 'Imprint' : 'Impressum'}}</span>
            </button>
        </div>
    </div>
</div>
<app-legal-notice *ngIf="services.showLegalNoticeCard" (close)="closeCard()"></app-legal-notice>
<app-creator *ngIf="services.showImprintCard" (close)="closeCard()"></app-creator>
