<div class="feedback">
    <h1>
        {{services.language == "en" ? 'What my colleagues say about me' : 'Was meine Kollegen über mich sagen'}}
    </h1>
    <div class="carousel-container">
        <div class="carousel-track">
            <div class="carousel-card" *ngFor="let feedback of feedbacks; let i = index" [ngClass]="getCardPosition(i)"
                (click)="setIndex(i)">
                <p *ngIf="services.language=='en'" class="message">"{{ feedback.message.en }}"</p>
                <p *ngIf="services.language=='de'" class="message">"{{ feedback.message.de }}"</p>

                <p class="author">– {{ feedback.author }}</p>
            </div>
        </div>

        <div class="carousel-controls">
            <button mat-icon-button (click)="setIndex(prevIndex)">
                <img src="assets/img/arrow_back.png" alt="back">
            </button>

            <div class="dots">
                <span *ngFor="let _ of feedbacks; let i = index" class="dot" [class.active]="i === currentIndex"
                    (click)="setIndex(i)"></span>
            </div>

            <button mat-icon-button (click)="setIndex(nextIndex)">
                <img src="assets/img/arrow_forward.png" alt="forward">
            </button>
        </div>
    </div>
</div>
